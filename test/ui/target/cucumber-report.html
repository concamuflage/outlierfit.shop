And I add the product to the cart\n    And I go to the cart page\n    And I click checkout\n    Then I should see the essential order details\n    When I start Stripe Checkout payment\n    Then I should be redirected to the Stripe Checkout page\n    When I pay with the Stripe test card \"4000 0000 0000 0002\"\n    And I enter the Stripe expiration date \"12 \/ 34\"\n    And I enter the Stripe security code \"123\"\n    And I enter the Stripe cardholder name \"UI Test User\"\n    And I submit the Stripe payment\n    Then Stripe Checkout should show a declined card error\n    And I should remain on the Stripe Checkout page\n\n  # Scenario: A user can cancel Stripe Checkout through Browser Back button and return to the cart review\n  #   Given I open the login page\n  #   Then I should be on the login page\n  #   When I sign in with the configured test account\n  #   Then I should land on the products page\n  #   When I click on the \"Hoodies\" filter\n  #   And click on the first product\n  #   And I add the product to the cart\n  #   And I go to the cart page\n  #   And I click checkout\n  #   Then I should see the essential order details\n  #   When I start Stripe Checkout payment\n  #   Then I should be redirected to the Stripe Checkout page\n  #   When I cancel Stripe Checkout through Browser's back button\n  #   Then I should be returned to the cart page\n  #   And the cart should still show the correct total price with shipping cost\n\n    Scenario: A user can cancel Stripe Checkout through Back button on the Stripe Checkout page and return to the cart review\n    Given I open the login page\n    Then I should be on the login page\n    When I sign in with the configured test account\n    Then I should land on the products page\n    When I click on the \"Hoodies\" filter\n    And click on the first product\n    And I add the product to the cart\n    And I go to the cart page\n    And I click checkout\n    Then I should see the essential order details\n    When I start Stripe Checkout payment\n    Then I should be redirected to the Stripe Checkout page\n    When I cancel Stripe Checkout through Back button on the Stripe Checkout page\n    Then I should be returned to the cart page\n    And the cart should still show the correct total price with shipping cost\n","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:\/\/\/Users\/Mark_1\/project888\/test\/ui\/src\/test\/resources\/features\/payment.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@Payment","id":"82c13f4c-1729-43af-bf47-b9fb076206da"},{"location":{"line":1,"column":9},"name":"@Regression","id":"f0a2409a-6acc-48cb-8f3f-d1ec371e29d1"}],"language":"en","keyword":"Feature","name":"Stripe payment","description":"","children":[{"scenario":{"location":{"line":29,"column":3},"tags":[],"keyword":"Scenario","name":"A user sees a card error when Stripe declines the payment","description":"","steps":[{"location":{"line":30,"column":5},"keyword":"Given ","keywordType":"Context","text":"I open the login page","id":"bd36a527-ac5f-41e5-a835-d2d6397e8a3e"},{"location":{"line":31,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"I should be on the login page","id":"31f83d7e-f1e6-47f5-84b4-52b73fc13f29"},{"location":{"line":32,"column":5},"keyword":"When ","keywordType":"Action","text":"I sign in with the configured test account","id":"5aaf91af-0384-429e-a70e-897b02c19127"},{"location":{"line":33,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"I should land on the products page","id":"300e3976-3740-4634-b45d-ff3caa044496"},{"location":{"line":34,"column":5},"keyword":"When ","keywordType":"Action","text":"I click on the \"Hoodies\" filter","id":"add4c3b3-ae96-470b-a11b-fa86bcda7e87"},{"location":{"line":35,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"click on the first product","id":"f3148020-4963-400c-a6d9-572cb93d230d"},{"location":{"line":36,"column":5}," ticated for the orders API\n  #   And I remember the current default measurement\n  #   And a checkout fixture is available\n  #   When I retrieve the current profile\n  #   Then the profile response should include the current user\n  #   When I save a new default measurement\n  #   Then the profile response should include the saved measurement\n  #   When I copy the default shipping address to billing\n  #   Then the profile response should include at least one billing address\n  #   When I save a new billing address\n  #   Then the profile response should include the new billing address\n  #   When I delete the new billing address\n  #   Then the profile response should no longer include the deleted billing address\n\n  Scenario: Account deletion requires authentication and password confirmation\n    When I delete the current account without authentication\n    Then the account delete response should be unauthorized\n    Given a verified disposable account exists for account deletion\n    And I am authenticated as the disposable account\n    When I delete the current account with the wrong password\n    Then the account delete response should reject password confirmation\n    When I delete the current account with the correct password\n    Then the account delete response should be successful\n    And the disposable account should no longer be able to log in\n","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:\/\/\/Users\/Mark_1\/project888\/test\/ui\/src\/test\/resources\/features\/profile-api.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@ProfileApi","id":"e4d13498-dbc3-47a4-910a-97f067449430"},{"location":{"line":1,"column":12},"name":"@Regression","id":"54db48a6-4ffd-403e-b27c-8baf94dcd0b2"}],"language":"en","keyword":"Feature","name":"Profile API","description":"","children":[{"scenario":{"location":{"line":19,"column":3},"tags":[],"keyword":"Scenario","name":"Account delet  am authenticated for the orders API"},{"location":{"line":6,"column":1},"text":"  #   And I remember the current default measurement"},{"location":{"line":7,"column":1},"text":"  #   And a checkout fixture is available"},{"location":{"line":8,"column":1},"text":"  #   When I retrieve the current profile"},{"location":{"line":9,"column":1},"text":"  #   Then the profile response should include the current user"},{"location":{"line":10,"column":1},"text":"  #   When I save a new default measurement"},{"location":{"line":11,"column":1},"text":"  #   Then the profile response should include the saved measurement"},{"location":{"line":12,"column":1},"text":"  #   When I copy the default shipping address to billing"},{"location":{"line":13,"column":1},"text":"  #   Then the profile response should include at least one billing address"},{"location":{"line":14,"column":1},"text":"  #   When I save a new billing address"},{"location":{"line":15,"column":1},"text":"  #   Then the profile response should include the new billing address"},{"location":{"line":16,"column":1},"text":"  #   When I delete the new billing address"},{"location":{"line":17,"column":1},"text":"  #   Then the profile response should no longer include the deleted billing address"}]}},{"pickle":{"id":"11d9d175-4ae9-4c94-b853-01f6801cf2ab","uri":"file:\/\/\/Users\/Mark_1\/project888\/test\/ui\/src\/test\/resources\/features\/profile-api.feature","name":"Account deletion requires authentication and password confirmation","language":"en","steps":[{"astNodeIds":["f819c80b-6bb8-461e-ae1c-987390e32d73"],"id":"bc2c5c3a-bb27-4ff4-ab35-70d4ffd6cb1a","type":"Action","text":"I delete the current account without authentication"},{"astNodeIds":["8f69beab-e3f6-4abf-8ebc-1b9b30e87044"],"id":"939c35bc-4ddd-4a71-9fbc-3a517e500413","type":"Outcome","text":"the account delete response should be unauthorized"},{"astNodeIds":["b14b4b96-6d3a-4105-8d3a-7f6fab92ab0a"],"id":"9e89798f-9bde-4ad8-8a6d-a6a492d70fdd","type":"Context", n I sign up with a plus email based on \"concamuflage@gmail.com\" and password \"StrongPass123A\"\n    Then the signup should be successful and ask the user to verify their email address\n    # correct but unverified account should not be able to log in\n    Given I open the login page\n    Then I should be on the login page\n    When I login in with the generated plus email and password \"StrongPass123A\"\n    Then the login should fail with an error message about email verification\n    And Wait 10 Seconds before login and look for verification email\n    And I log into its email account through the API and find the verification email\n    And the verification email sender should be correct\n    And I click the link in the verification email\n    Then the email verification should be successful\n    # login with wrong password\n    Given I open the login page\n    Then I should be on the login page\n    And I login in with the generated plus email and password \"StrongPass123B\"\n    Then the login should fail with an error message about incorrect password\n    # login with correct password\n    Given I open the login page\n    Then I should be on the login page\n    When I login in with the generated plus email and password \"StrongPass123A\"\n    Then the login should be successful and land on the products page\n\n  Scenario: User can request a new verification email if they haven't received the original one\n    When I sign up with a plus email based on \"concamuflage@gmail.com\" and password \"StrongPass123A\"\n    Then the signup should be successful and ask the user to verify their email address\n    When I request a new verification email\n    Then Wait 10 Seconds before login and look for verification email\n    And I log into its email account through the API and find the verification email\n    And the verification email sender should be correct\n    And I click the link in the verification email\n    Then the email verification should be successful\n    # login with correct password\n    Given I open the login page\n    Then I should be on the login page\n    When I login in with the generated plus email and password \"StrongPass123A\"\n    Then the login should be successful and land on the products page\n\n  Scenario: User cannot sign up twice with the same email address\n    # register for the first time\n    When I sign up with a plus email based on \"concamuflage@gmail.com\" and password \"StrongPass123A\"\n    Then the signup should be successful and ask the user to verify their email address\n    # register for the second time with the same generated plus email\n    Given I open the signup page\n    Then I should be on the signup page\n    When I sign up with the same generated plus email and password \"StrongPass123A\"\n    Then the signup page should show a validation error\n\n  Scenario Outline: User cannot sign up with a password that violates the password policy\n    # Minimum length: 12\n    # Must include lowercase: [a-z]\n    # Must include uppercase: [A-Z]\n    # Must include a digit: \\d\n    # Must not contain whitespace: \\s\n    # Special characters are allowed but not required\n    When I sign up with a generated account using password \"<password>\"\n    Then the signup page should show the password requirements error\n\n    Examples:\n      | password      |\n      | Short1!       |\n      | lowercase123! |\n      | UPPERCASE123! |\n      | NoDigitsHere! |\n      | Has Space123! |\n      # Too short\n      # Missing uppercase letter\n      # Missing lowercase letter\n      # Missing digit\n      # Contains whitespace\n","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:\/\/\/Users\/Mark_1\/project888\/test\/ui\/src\/test\/resources\/features\/signup_login.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@Signup","id":"58971903-151e-4a13-b82b-46552a698b6f"},{"location":{"line":1,"column":9},"name":"@Regression" ta":"@StripeWebhookApi@Regression\nFeature: Stripe webhook API\n\n  Scenario: A paid Stripe Checkout session is fulfilled by webhook and becomes invoice-ready\n    Given I am authenticated for the orders API\n    And a checkout fixture is available\n    And I save the current cart selections and items\n    And a Stripe checkout session exists for the current cart\n    When Stripe sends a checkout.session.completed webhook for that session with payment status paid\n    Then the webhook response should be accepted\n    And the webhook event should be recorded\n    And the payment record should be stored as paid\n    And the Stripe checkout session should be linked to a created order\n    When I retrieve that single order\n    Then the single order response should match the webhook-created order\n    When I retrieve the invoice payload for that order\n    Then the invoice payload response should include the complete order information\n    When I retrieve the invoice PDF for that order\n    Then the order invoice PDF response should be a downloadable PDF\n\n  Scenario: A failed Stripe payment is recorded without creating an order\n    Given I am authenticated for the orders API\n    And a checkout fixture is available\n    And I save the current cart selections and items\n    And a Stripe checkout session exists for the current cart\n    When Stripe sends a payment_intent.payment_failed webhook for that session\n    Then the webhook response should be accepted\n    And the webhook event should be recorded\n    And the payment record should be stored as failed\n    And no order should be created for that Stripe checkout session\n\n  Scenario: Duplicate Stripe webhook delivery does not create duplicate orders\n    Given I am authenticated for the orders API\n    And a checkout fixture is available\n    And I save the current cart selections and items\n    And a Stripe checkout session exists for the current cart\n    When Stripe sends the same checkout.session.completed w
