# Exposes only authenticated Jenkins through TLS; e.g. /job/outlierfit-staging/3/console.
map $http_upgrade $jenkins_connection_upgrade {
    default upgrade;
    '' '';
}

# Empty keys bypass this zone: static assets and console streaming do not count as login attempts.
map $uri $jenkins_login_key {
    default '';
    /j_spring_security_check $binary_remote_addr;
    /j_acegi_security_check $binary_remote_addr;
}
limit_req_zone $jenkins_login_key zone=jenkins_login:10m rate=5r/m;

upstream outlierfit_jenkins {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name jenkins.outlierfit.shop;
    return 301 https://jenkins.outlierfit.shop$request_uri;
}

server {
    listen 443 ssl;
    server_name jenkins.outlierfit.shop;
    ssl_certificate /etc/letsencrypt/live/jenkins.outlierfit.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.outlierfit.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JenkinsTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    ignore_invalid_headers off;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # This controller builds locally; remote agents and the public HTTP CLI are not needed.
    location = /cli { return 404; }
    location ^~ /cli/ { return 404; }
    location = /tcpSlaveAgentListener/ { return 404; }

    location / {
        limit_req zone=jenkins_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://outlierfit_jenkins;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkins_connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
